aid: atomico
name: Atomico
description: >-
  Atomico is a London-headquartered European venture capital firm founded in 2006 by Niklas Zennstrom,
  co-founder of Skype and Kazaa. Atomico partners with Europe's most ambitious technology founders from
  the earliest stages to pre-IPO across two dedicated teams: a Venture team that invests predominantly at
  Series A alongside occasional Seed opportunities, and a Growth team that invests from Series B to pre-IPO.
  In September 2024 the firm closed its largest ever fundraise, $1.24 billion across two funds - a $754M
  Atomico Growth VI vehicle and a $485M Atomico Venture VI vehicle - bringing total capital raised across
  seven funds to more than $5 billion. Growth-stage checks typically range from roughly $10M to $50M+.
  Atomico invests broadly across enterprise software, fintech, consumer, health, AI, developer tools,
  infrastructure, industrial and climate technology, with an explicit thesis that European technology has
  come of age. The firm operates offices in London, Paris, Berlin and Stockholm and is known for backing
  category-defining companies including Klarna, Stripe, Supercell, Graphcore, DeepL, Pipedrive, Truecaller,
  Wellhub, Lilium, Compass, Hinge Health and Sorare. Atomico also publishes the annual State of European
  Tech report, the definitive data-driven analysis of the European technology ecosystem.
